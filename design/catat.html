<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
    <meta content="mobile_stack" name="shell-type">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <style>
        @layer base {

            html,
            body {
                width: 100vw;
                margin: 0;
                padding: 0;
            }

            body {
                overscroll-behavior: none;
                background-color: #faf9f6;
                color: #1a1c1a;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-low": "#f4f3f0", "surface": "#faf9f6", "primary": "#07080a", "outline-variant": "#c6c6ca", "on-tertiary-fixed": "#1c1c1a", "surface-tint": "#5e5e60", "on-tertiary-container": "#898785", "tertiary-fixed": "#e5e2df", "on-tertiary": "#ffffff", "secondary-fixed": "#ffdbd1", "on-secondary": "#ffffff", "surface-container-high": "#e9e8e5", "on-tertiary-fixed-variant": "#474745", "tertiary-container": "#20201f", "secondary": "#a13f23", "inverse-primary": "#c7c6c8", "primary-container": "#1f2022", "on-primary-fixed": "#1b1c1e", "tertiary": "#080807", "error": "#ba1a1a", "on-surface-variant": "#45474a", "error-container": "#ffdad6", "surface-container-highest": "#e3e2e0", "surface-bright": "#faf9f6", "secondary-fixed-dim": "#ffb5a0", "background": "#faf9f6", "on-error-container": "#93000a", "on-primary": "#ffffff", "on-primary-fixed-variant": "#464749", "on-secondary-fixed": "#3b0900", "tertiary-fixed-dim": "#c8c6c3", "surface-dim": "#dbdad7", "surface-container-lowest": "#ffffff", "on-surface": "#1a1c1a", "inverse-on-surface": "#f2f1ee", "surface-container": "#efeeeb", "secondary-container": "#ff8664", "inverse-surface": "#2f312f", "on-secondary-fixed-variant": "#81280d", "on-secondary-container": "#741f04", "on-background": "#1a1c1a", "on-error": "#ffffff", "outline": "#76777b", "on-primary-container": "#87878a", "primary-fixed-dim": "#c7c6c8", "surface-variant": "#e3e2e0" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-xl": "2.5rem", "margin-tablet": "2rem", "space-md": "1rem", "gutter": "1rem", "margin": "1.25rem", "space-lg": "1.5rem", "space-xs": "0.25rem" }, fontFamily: { "headline-hero-mobile": ["Newsreader"], "headline-md": ["Newsreader"], "label-md": ["Hanken Grotesk"], "body-lg": ["Hanken Grotesk"], "amount-row": ["Hanken Grotesk"], "amount-display-mobile": ["Newsreader"], "amount-display": ["Newsreader"], "headline-sm": ["Newsreader"], "body-md": ["Hanken Grotesk"], "body-sm": ["Hanken Grotesk"], "headline-hero": ["Newsreader"], "headline-lg": ["Newsreader"], "label-caps": ["Hanken Grotesk"] }, fontSize: { "headline-hero-mobile": ["36px", { "lineHeight": "40px", "letterSpacing": "-0.025em", "fontWeight": "400" }], "headline-md": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.015em", "fontWeight": "500" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "amount-row": ["17px", { "lineHeight": "22px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "amount-display-mobile": ["30px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "400" }], "amount-display": ["40px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-hero": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "400" }], "label-caps": ["11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "600" }] } } } };</script>
</head>

<body
    class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-secondary-fixed">
    <header class="fixed top-0 w-full z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.03)]">
        <div class="h-16 px-margin flex items-center justify-between">
            <div class="flex items-center gap-space-sm"><button
                    class="w-11 h-11 -ml-2 flex items-center justify-center text-on-surface active:opacity-60 transition-opacity"
                    onclick="history.back()" type="button"><span
                        class="material-symbols-outlined text-[20px]">arrow_back</span></button>
                <h1 class="font-headline-sm text-headline-sm text-on-surface">Catat Transaksi</h1>
            </div>
        </div>
    </header>
    <main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface">
        <div class="flex flex-col w-full">
            <div class="w-full px-margin pt-space-xs pb-space-sm bg-surface flex flex-col gap-space-sm">
                <div class="flex items-center justify-center border-b border-surface-container-high pb-0 w-full">
                    <div class="flex items-center justify-center gap-space-lg"><button
                            class="relative pb-2 text-label-md font-label-md text-secondary font-medium tracking-tight"
                            id="tab-expense" onclick="switchType('expense')" type="button">Pengeluaran<span
                                class="absolute bottom-0 left-0 right-0 h-[2px] bg-secondary"
                                id="tab-expense-line"></span></button><button
                            class="relative pb-2 text-label-md font-label-md text-on-surface-variant font-normal tracking-tight"
                            id="tab-income" onclick="switchType('income')" type="button">Pemasukan<span
                                class="absolute bottom-0 left-0 right-0 h-[2px] bg-transparent"
                                id="tab-income-line"></span></button><button
                            class="relative pb-2 text-label-md font-label-md text-on-surface-variant font-normal tracking-tight"
                            id="tab-transfer" onclick="switchType('transfer')" type="button">Transfer<span
                                class="absolute bottom-0 left-0 right-0 h-[2px] bg-transparent"
                                id="tab-transfer-line"></span></button></div>
                </div>
            </div>
            <div
                class="w-full px-margin py-space-md bg-surface-container-lowest flex flex-col items-center justify-center">
                <span class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-widest mb-1"
                    id="ledger-type-label">Nominal Pengeluaran</span>
                <div class="flex items-baseline justify-center gap-1.5 select-none overflow-x-auto max-w-full px-2">
                    <span class="font-headline-sm text-headline-sm text-on-surface-variant font-medium">Rp</span>
                    <div class="flex items-baseline">
                        <span
                            class="font-headline-hero-mobile text-headline-hero-mobile text-on-surface font-normal tracking-tight tabular-nums"
                            id="amount-display">0</span>
                        <span class="inline-block w-[2px] h-[32px] ml-1 bg-secondary animate-pulse self-center"
                            id="cursor-caret"></span>
                    </div>
                </div>
                <div
                    class="mt-3 flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low text-on-surface-variant text-body-sm font-body-sm">
                    <span class="material-symbols-outlined text-[16px]">calendar_today</span><span class="">Hari ini, 18
                        Sep</span>
                </div>
            </div>
            <div class="w-full px-margin py-space-sm bg-surface flex flex-col gap-space-sm">
                <div id="category-section" class="flex flex-col gap-space-sm">
                    <div class="flex items-center justify-between"><span
                            class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider">Kategori
                            Cepat</span><span class="text-body-sm font-body-sm text-on-surface-variant"
                            id="selected-category-text">Makan &amp; Minum</span></div>
                    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5"><button
                            class="cat-pill shrink-0 px-3 py-1.5 bg-primary text-on-primary rounded text-label-md font-label-md transition-colors"
                            onclick="selectCategory(this, 'Makan &amp; Minum')" type="button">Makan &amp;
                            Minum</button><button
                            class="cat-pill shrink-0 px-3 py-1.5 bg-surface-container-high text-on-surface-variant rounded text-label-md font-label-md transition-colors"
                            onclick="selectCategory(this, 'Belanja')" type="button">Belanja</button><button
                            class="cat-pill shrink-0 px-3 py-1.5 bg-surface-container-high text-on-surface-variant rounded text-label-md font-label-md transition-colors"
                            onclick="selectCategory(this, 'Transport')" type="button">Transport</button><button
                            class="cat-pill shrink-0 px-3 py-1.5 bg-surface-container-high text-on-surface-variant rounded text-label-md font-label-md transition-colors"
                            onclick="selectCategory(this, 'Tagihan')" type="button">Tagihan</button><button
                            class="cat-pill shrink-0 px-3 py-1.5 bg-surface-container-high text-on-surface-variant rounded text-label-md font-label-md transition-colors"
                            onclick="selectCategory(this, 'Hiburan')" type="button">Hiburan</button><button
                            class="cat-pill shrink-0 px-3 py-1.5 bg-surface-container-high text-on-surface-variant rounded text-label-md font-label-md transition-colors"
                            onclick="selectCategory(this, 'Lainnya')" type="button">Lainnya</button></div>
                </div>
                <div id="standard-source-section" class="flex items-center justify-between pt-1"><span
                        class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider"
                        id="source-label-text">Sumber Dana</span>
                    <div class="flex items-center gap-1.5"><button
                            class="source-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-highest text-on-surface font-medium transition-colors"
                            onclick="selectSource(this, 'BCA')" type="button">BCA</button><button
                            class="source-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-low text-on-surface-variant transition-colors"
                            onclick="selectSource(this, 'Tunai')" type="button">Tunai</button><button
                            class="source-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-low text-on-surface-variant transition-colors"
                            onclick="selectSource(this, 'E-Wallet')" type="button">E-Wallet</button></div>
                </div>
                <div id="transfer-accounts-section" class="hidden flex-col gap-2 pt-1">
                    <div class="flex items-center justify-between"><span
                            class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider">Dari
                            (Sumber)</span>
                        <div class="flex items-center gap-1.5"><button
                                class="from-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-highest text-on-surface font-medium transition-colors"
                                onclick="selectTransferFrom(this, 'BCA')" type="button">BCA</button><button
                                class="from-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-low text-on-surface-variant transition-colors"
                                onclick="selectTransferFrom(this, 'Tunai')" type="button">Tunai</button><button
                                class="from-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-low text-on-surface-variant transition-colors"
                                onclick="selectTransferFrom(this, 'E-Wallet')" type="button">E-Wallet</button></div>
                    </div>
                    <div class="flex items-center justify-between"><span
                            class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider">Ke
                            (Tujuan)</span>
                        <div class="flex items-center gap-1.5"><button
                                class="to-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-low text-on-surface-variant transition-colors"
                                onclick="selectTransferTo(this, 'BCA')" type="button">BCA</button><button
                                class="to-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-highest text-on-surface font-medium transition-colors"
                                onclick="selectTransferTo(this, 'Tunai')" type="button">Tunai</button><button
                                class="to-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-low text-on-surface-variant transition-colors"
                                onclick="selectTransferTo(this, 'E-Wallet')" type="button">E-Wallet</button></div>
                    </div>
                </div>
                <div class="w-full bg-surface-container-lowest px-3 py-2 rounded flex items-center gap-2"><span
                        class="material-symbols-outlined text-[16px] text-on-surface-variant">edit_note</span><input
                        class="w-full bg-transparent text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none"
                        id="note-input" placeholder="Catatan opsional (cth: Kopi pagi)..." type="text"></div>
            </div>
            <div class="w-full px-margin pt-space-xs pb-space-sm bg-surface">
                <div class="grid grid-cols-3 gap-1.5 w-full bg-surface-container-low p-1.5 rounded-lg select-none">
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('1')" type="button">1</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('2')" type="button">2</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('3')" type="button">3</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('4')" type="button">4</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('5')" type="button">5</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('6')" type="button">6</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('7')" type="button">7</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('8')" type="button">8</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('9')" type="button">9</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-body-md font-body-md text-on-surface font-semibold tabular-nums"
                        onclick="inputQuickZeros()" type="button">000</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-headline-sm font-headline-sm text-on-surface tabular-nums"
                        onclick="inputDigit('0')" type="button">0</button>
                    <button
                        class="h-12 flex items-center justify-center bg-surface-container-lowest rounded active:bg-surface-container-high transition-colors text-on-surface"
                        onclick="inputBackspace()" type="button">
                        <span class="material-symbols-outlined text-[20px]">backspace</span>
                    </button>
                </div>
                <div class="mt-space-sm w-full">
                    <button
                        class="w-full h-12 bg-secondary text-on-secondary rounded flex items-center justify-center gap-2 active:opacity-90 transition-opacity"
                        id="submit-btn" onclick="saveTransaction()" type="button">
                        <span class="text-body-lg font-body-lg font-medium" id="submit-text">Simpan Pengeluaran</span>
                        <span class="material-symbols-outlined text-[18px]">check</span>
                    </button>
                </div>
            </div>
        </div>
        <script>
            let rawAmount = '';
            let transactionType = 'expense';
            let selectedCategory = 'Makan & Minum';
            let selectedSource = 'BCA';

            function formatRupiah(value) {
                if (!value || value === '0') return '0';
                return value.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            }

            function updateDisplay() {
                const displayEl = document.getElementById('amount-display');
                if (rawAmount === '' || rawAmount === '0') {
                    displayEl.textContent = '0';
                } else {
                    displayEl.textContent = formatRupiah(rawAmount);
                }
            }

            function inputDigit(digit) {
                if (rawAmount === '0' && digit === '0') return;
                if (rawAmount === '0') rawAmount = '';
                if (rawAmount.length < 11) {
                    rawAmount += digit;
                    updateDisplay();
                }
            }

            function inputQuickZeros() {
                if (rawAmount === '' || rawAmount === '0') return;
                if (rawAmount.length <= 8) {
                    rawAmount += '000';
                    updateDisplay();
                }
            }

            function inputBackspace() {
                if (rawAmount.length > 0) {
                    rawAmount = rawAmount.slice(0, -1);
                    updateDisplay();
                }
            }

            function switchType(type) {
                transactionType = type;
                const tabExpense = document.getElementById('tab-expense');
                const tabIncome = document.getElementById('tab-income');
                const lineExpense = document.getElementById('tab-expense-line');
                const lineIncome = document.getElementById('tab-income-line');
                const typeLabel = document.getElementById('ledger-type-label');
                const submitText = document.getElementById('submit-text');

                if (type === 'expense') {
                    tabExpense.classList.add('text-secondary', 'font-medium');
                    tabExpense.classList.remove('text-on-surface-variant', 'font-normal');
                    lineExpense.classList.remove('bg-transparent');
                    lineExpense.classList.add('bg-secondary');

                    tabIncome.classList.remove('text-secondary', 'font-medium');
                    tabIncome.classList.add('text-on-surface-variant', 'font-normal');
                    lineIncome.classList.remove('bg-secondary');
                    lineIncome.classList.add('bg-transparent');

                    typeLabel.textContent = 'Nominal Pengeluaran';
                    submitText.textContent = 'Simpan Pengeluaran';
                } else {
                    tabIncome.classList.add('text-secondary', 'font-medium');
                    tabIncome.classList.remove('text-on-surface-variant', 'font-normal');
                    lineIncome.classList.remove('bg-transparent');
                    lineIncome.classList.add('bg-secondary');

                    tabExpense.classList.remove('text-secondary', 'font-medium');
                    tabExpense.classList.add('text-on-surface-variant', 'font-normal');
                    lineExpense.classList.remove('bg-secondary');
                    lineExpense.classList.add('bg-transparent');

                    typeLabel.textContent = 'Nominal Pemasukan';
                    submitText.textContent = 'Simpan Pemasukan';
                }
            }

            function selectCategory(btn, category) {
                selectedCategory = category;
                document.getElementById('selected-category-text').textContent = category;
                const pills = document.querySelectorAll('.cat-pill');
                pills.forEach((p) => {
                    p.className = 'cat-pill shrink-0 px-3 py-1.5 bg-surface-container-high text-on-surface-variant rounded text-label-md font-label-md transition-colors';
                });
                btn.className = 'cat-pill shrink-0 px-3 py-1.5 bg-primary text-on-primary rounded text-label-md font-label-md transition-colors';
            }

            function selectSource(btn, source) {
                selectedSource = source;
                const chips = document.querySelectorAll('.source-chip');
                chips.forEach((c) => {
                    c.className = 'source-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-low text-on-surface-variant transition-colors';
                });
                btn.className = 'source-chip px-2.5 py-1 text-label-md font-label-md rounded bg-surface-container-highest text-on-surface font-medium transition-colors';
            }

            function saveTransaction() {
                const amountVal = rawAmount === '' ? '0' : rawAmount;
                const noteVal = document.getElementById('note-input').value;
                const btn = document.getElementById('submit-btn');

                btn.classList.add('opacity-70');
                setTimeout(() => {
                    btn.classList.remove('opacity-70');
                    history.back();
                }, 280);
            }
        </script>
    </main>

</body>

</html>
