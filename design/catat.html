<!DOCTYPE html>

<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <meta content="mobile_stack" name="shell-type" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <style>
        @layer base {

            html,
            body {
                width: 100vw;
                margin: 0;
                padding: 0;
            }

            body {
                overscroll-behavior: none;
                background-color: #0b0b12;
                color: #e4e1ec;
                font-family: 'Plus Jakarta Sans', sans-serif;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 16px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 16px);
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .neon-glow-btn {
            box-shadow: 0 8px 24px -4px rgba(160, 120, 255, 0.45), 0 2px 10px -2px rgba(76, 215, 246, 0.35);
        }

        .neon-glow-tab {
            box-shadow: 0 4px 16px -2px rgba(160, 120, 255, 0.4);
        }

        .keypad-press:active {
            transform: scale(0.96);
            background-color: #2e2d38 !important;
        }
    </style>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary": "#ffb690",
                        "secondary-fixed": "#acedff",
                        "surface": "#13131a",
                        "surface-container-low": "#161620",
                        "on-surface": "#e4e1ec",
                        "on-primary": "#3c0091",
                        "secondary-container": "#03b5d3",
                        "error-container": "#93000a",
                        "on-secondary": "#003640",
                        "tertiary-container": "#ec6a06",
                        "on-tertiary-fixed-variant": "#783200",
                        "surface-bright": "#393841",
                        "on-tertiary-container": "#4a1c00",
                        "on-tertiary": "#552100",
                        "tertiary-fixed": "#ffdbca",
                        "primary": "#d0bcff",
                        "on-primary-container": "#340080",
                        "on-secondary-container": "#00424e",
                        "on-tertiary-fixed": "#341100",
                        "surface-container-lowest": "#0b0b12",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#cbc3d7",
                        "on-primary-fixed-variant": "#5516be",
                        "inverse-surface": "#e4e1ec",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#004e5c",
                        "surface-variant": "#34343c",
                        "on-primary-fixed": "#23005c",
                        "inverse-primary": "#6d3bd7",
                        "inverse-on-surface": "#303038",
                        "outline": "#958ea0",
                        "primary-fixed": "#e9ddff",
                        "primary-fixed-dim": "#d0bcff",
                        "background": "#0b0b12",
                        "surface-container-highest": "#34343c",
                        "on-background": "#e4e1ec",
                        "surface-container": "#1b1b24",
                        "secondary-fixed-dim": "#4cd7f6",
                        "surface-container-high": "#23232d",
                        "tertiary-fixed-dim": "#ffb690",
                        "primary-container": "#a078ff",
                        "on-secondary-fixed": "#001f26",
                        "outline-variant": "#494454",
                        "surface-tint": "#d0bcff",
                        "surface-dim": "#13131a",
                        "on-error": "#690005",
                        "secondary": "#4cd7f6"
                    },
                    fontFamily: {
                        sans: ["Plus Jakarta Sans", "sans-serif"],
                        "display-currency": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "headline-xl-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-[#0b0b12] text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary selection:text-[#13131a] relative overflow-x-hidden">
    <!-- Ambient Neon Background Glows -->
    <div class="fixed -top-24 -left-20 w-80 h-80 rounded-full bg-purple-700/20 blur-[100px] pointer-events-none"></div>
    <div class="fixed top-1/4 -right-24 w-80 h-80 rounded-full bg-cyan-500/15 blur-[110px] pointer-events-none"></div>
    <div
        class="fixed bottom-10 left-10 w-72 h-72 rounded-full bg-primary-container/10 blur-[120px] pointer-events-none">
    </div>
    <!-- Top Header Navigation -->
    <header class="sticky top-0 w-full z-50 pt-safe bg-[#0b0b12]/80 backdrop-blur-xl border-b border-white/[0.04]">
        <div class="h-14 px-4 flex items-center justify-between">
            <button aria-label="Kembali"
                class="w-10 h-10 -ml-1 rounded-full flex items-center justify-center text-on-surface hover:bg-white/5 active:scale-95 transition-all"
                onclick="history.back()" type="button">
                <span class="material-symbols-outlined text-[22px]">arrow_back</span>
            </button>
            <h1 class="text-[17px] font-bold text-white tracking-tight">Catat Transaksi</h1>
            <button aria-label="Menu Opsi"
                class="w-10 h-10 -mr-1 rounded-full flex items-center justify-center text-on-surface-variant hover:text-white hover:bg-white/5 active:scale-95 transition-all"
                type="button">
                <span class="material-symbols-outlined text-[22px]">more_horiz</span>
            </button>
        </div>
    </header>
    <!-- Main Content Container -->
    <main class="flex-1 flex flex-col relative w-full px-4 pt-2 pb-safe z-10 max-w-md mx-auto justify-between">
        <div class="flex flex-col gap-3 w-full">
            <!-- Segmented Control Pills (Pengeluaran / Pemasukan / Transfer) -->
            <div
                class="w-full bg-[#161622]/90 border border-white/[0.06] p-1 rounded-full flex items-center gap-1 backdrop-blur-md">
                <button
                    class="flex-1 py-2 rounded-full text-[13px] font-semibold text-white bg-gradient-to-r from-[#9b51e0] via-[#7928ca] to-[#2575fc] neon-glow-tab transition-all flex items-center justify-center gap-1.5 shadow-sm"
                    id="tab-expense" onclick="switchType('expense')" type="button">
                    <span class="material-symbols-outlined text-[15px]">arrow_downward</span>
                    <span>Pengeluaran</span>
                </button>
                <button
                    class="flex-1 py-2 rounded-full text-[13px] font-medium text-on-surface-variant hover:text-white transition-all flex items-center justify-center gap-1.5"
                    id="tab-income" onclick="switchType('income')" type="button">
                    <span class="material-symbols-outlined text-[15px]">arrow_upward</span>
                    <span>Pemasukan</span>
                </button>
                <button
                    class="flex-1 py-2 rounded-full text-[13px] font-medium text-on-surface-variant hover:text-white transition-all flex items-center justify-center gap-1.5"
                    id="tab-transfer" onclick="switchType('transfer')" type="button">
                    <span class="material-symbols-outlined text-[15px]">sync_alt</span>
                    <span>Transfer</span>
                </button>
            </div>
            <!-- Area Display Nominal (Card Glassmorphic Neon) -->
            <div
                class="w-full bg-gradient-to-b from-[#181826] to-[#12121e] border border-white/[0.08] rounded-2xl p-4 flex flex-col items-center justify-center relative shadow-lg shadow-black/40 overflow-hidden">
                <div
                    class="absolute -top-12 -right-12 w-28 h-28 bg-[#a078ff]/15 rounded-full blur-2xl pointer-events-none">
                </div>
                <span class="text-[11px] font-bold text-on-surface-variant/80 tracking-[0.14em] uppercase mb-1"
                    id="ledger-type-label">
                    NOMINAL PENGELUARAN
                </span>
                <div class="flex items-center justify-center gap-2 select-none overflow-x-auto max-w-full py-1">
                    <span class="text-2xl font-bold text-on-surface-variant/60 tracking-tight">Rp</span>
                    <div class="flex items-center">
                        <span class="text-[38px] font-extrabold text-white tracking-tight tabular-nums leading-none"
                            id="amount-display">0</span>
                        <span
                            class="inline-block w-[3px] h-[34px] ml-1.5 rounded-full bg-gradient-to-b from-[#4cd7f6] to-[#a078ff] animate-pulse"
                            id="cursor-caret"></span>
                    </div>
                </div>
                <!-- Quick Date Chip -->
                <div
                    class="mt-2.5 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#20202e]/80 border border-white/[0.07] text-[#cbc3d7] text-[12px] font-medium shadow-inner">
                    <span class="material-symbols-outlined text-[14px] text-secondary">calendar_today</span>
                    <span>Hari ini, 18 Sep</span>
                </div>
            </div>
            <!-- Pilihan Kategori Cepat (Horizontal Scrollable Chips) -->
            <div class="flex flex-col gap-1.5" id="category-section">
                <div class="flex items-center justify-between px-0.5">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/70">Kategori
                        Cepat</span>
                    <span class="text-[12px] font-semibold text-secondary" id="selected-category-text">Makan &amp;
                        Minum</span>
                </div>
                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
                    <button
                        class="cat-pill shrink-0 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-purple-600/30 to-cyan-500/30 border border-primary/50 text-white font-semibold text-[13px] shadow-sm flex items-center gap-1.5 transition-all"
                        onclick="selectCategory(this, 'Makan &amp; Minum')" type="button">
                        <span class="material-symbols-outlined text-[15px] text-[#4cd7f6]">restaurant</span>
                        <span>Makan &amp; Minum</span>
                    </button>
                    <button
                        class="cat-pill shrink-0 px-3.5 py-1.5 rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant hover:text-white font-medium text-[13px] flex items-center gap-1.5 transition-all"
                        onclick="selectCategory(this, 'Belanja')" type="button">
                        <span class="material-symbols-outlined text-[15px]">shopping_bag</span>
                        <span>Belanja</span>
                    </button>
                    <button
                        class="cat-pill shrink-0 px-3.5 py-1.5 rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant hover:text-white font-medium text-[13px] flex items-center gap-1.5 transition-all"
                        onclick="selectCategory(this, 'Transport')" type="button">
                        <span class="material-symbols-outlined text-[15px]">directions_car</span>
                        <span>Transport</span>
                    </button>
                    <button
                        class="cat-pill shrink-0 px-3.5 py-1.5 rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant hover:text-white font-medium text-[13px] flex items-center gap-1.5 transition-all"
                        onclick="selectCategory(this, 'Tagihan')" type="button">
                        <span class="material-symbols-outlined text-[15px]">receipt_long</span>
                        <span>Tagihan</span>
                    </button>
                    <button
                        class="cat-pill shrink-0 px-3.5 py-1.5 rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant hover:text-white font-medium text-[13px] flex items-center gap-1.5 transition-all"
                        onclick="selectCategory(this, 'Hiburan')" type="button">
                        <span class="material-symbols-outlined text-[15px]">sports_esports</span>
                        <span>Hiburan</span>
                    </button>
                    <button
                        class="cat-pill shrink-0 px-3.5 py-1.5 rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant hover:text-white font-medium text-[13px] flex items-center gap-1.5 transition-all"
                        onclick="selectCategory(this, 'Lainnya')" type="button">
                        <span class="material-symbols-outlined text-[15px]">more_horiz</span>
                        <span>Lainnya</span>
                    </button>
                </div>
            </div>
            <!-- Pilihan Sumber Dana (Glassmorphic Pills) -->
            <div class="flex items-center justify-between px-0.5" id="standard-source-section">
                <span class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/70"
                    id="source-label-text">Sumber Dana</span>
                <div class="flex items-center gap-2">
                    <button
                        class="source-chip px-3 py-1 rounded-xl text-[12px] font-semibold bg-[#2a293b] border border-primary/40 text-white shadow-sm flex items-center gap-1 transition-all"
                        onclick="selectSource(this, 'BCA')" type="button">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#4cd7f6]"></span>
                        <span>BCA</span>
                    </button>
                    <button
                        class="source-chip px-3 py-1 rounded-xl text-[12px] font-medium bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant hover:text-white flex items-center gap-1 transition-all"
                        onclick="selectSource(this, 'Tunai')" type="button">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
                        <span>Tunai</span>
                    </button>
                    <button
                        class="source-chip px-3 py-1 rounded-xl text-[12px] font-medium bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant hover:text-white flex items-center gap-1 transition-all"
                        onclick="selectSource(this, 'E-Wallet')" type="button">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
                        <span>E-Wallet</span>
                    </button>
                </div>
            </div>
            <!-- Transfer Dual Source Section (Hidden by default) -->
            <div class="hidden flex-col gap-2 pt-0.5" id="transfer-accounts-section">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/70">Dari
                        (Sumber)</span>
                    <div class="flex items-center gap-1.5">
                        <button
                            class="from-chip px-2.5 py-1 text-[12px] font-semibold rounded-xl bg-[#2a293b] border border-primary/40 text-white"
                            onclick="selectTransferFrom(this, 'BCA')" type="button">BCA</button>
                        <button
                            class="from-chip px-2.5 py-1 text-[12px] font-medium rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant"
                            onclick="selectTransferFrom(this, 'Tunai')" type="button">Tunai</button>
                        <button
                            class="from-chip px-2.5 py-1 text-[12px] font-medium rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant"
                            onclick="selectTransferFrom(this, 'E-Wallet')" type="button">E-Wallet</button>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/70">Ke
                        (Tujuan)</span>
                    <div class="flex items-center gap-1.5">
                        <button
                            class="to-chip px-2.5 py-1 text-[12px] font-medium rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant"
                            onclick="selectTransferTo(this, 'BCA')" type="button">BCA</button>
                        <button
                            class="to-chip px-2.5 py-1 text-[12px] font-medium rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant"
                            onclick="selectTransferTo(this, 'Tunai')" type="button">Tunai</button>
                        <button
                            class="to-chip px-2.5 py-1 text-[12px] font-semibold rounded-xl bg-[#2a293b] border border-primary/40 text-white"
                            onclick="selectTransferTo(this, 'E-Wallet')" type="button">E-Wallet</button>
                    </div>
                </div>
            </div>
            <!-- Input Catatan Field -->
            <div
                class="w-full bg-[#161622]/90 border border-white/[0.06] rounded-xl px-3.5 py-2.5 flex items-center gap-2.5 focus-within:border-primary/50 transition-colors">
                <span class="material-symbols-outlined text-[18px] text-on-surface-variant/70">edit_note</span>
                <input
                    class="w-full bg-transparent text-[13px] text-white placeholder:text-outline/70 focus:outline-none"
                    id="note-input" placeholder="Catatan opsional (cth: Kopi pagi)..." type="text" />
            </div>
        </div>
        <!-- Bottom Section: Keypad + Action Button -->
        <div class="w-full flex flex-col gap-2.5 pt-2 pb-1">
            <!-- Thumb-friendly Numeric Keypad (Dark Modern Card Style as in Reference Screen) -->
            <div
                class="grid grid-cols-3 gap-2 w-full p-2 rounded-2xl bg-[#14141e]/90 border border-white/[0.05] shadow-xl select-none">
                <button
                    class="keypad-press h-13 py-2.5 flex flex-col items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('1')" type="button">
                    <span>1</span>
                    <span class="text-[9px] font-semibold text-outline tracking-wider -mt-0.5"> </span>
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex flex-col items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('2')" type="button">
                    <span>2</span>
                    <span class="text-[9px] font-semibold text-outline tracking-wider -mt-0.5">ABC</span>
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex flex-col items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('3')" type="button">
                    <span>3</span>
                    <span class="text-[9px] font-semibold text-outline tracking-wider -mt-0.5">DEF</span>
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex flex-col items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('4')" type="button">
                    <span>4</span>
                    <span class="text-[9px] font-semibold text-outline tracking-wider -mt-0.5">GHI</span>
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex flex-col items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('5')" type="button">
                    <span>5</span>
                    <span class="text-[9px] font-semibold text-outline tracking-wider -mt-0.5">JKL</span>
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex flex-col items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('6')" type="button">
                    <span>6</span>
                    <span class="text-[9px] font-semibold text-outline tracking-wider -mt-0.5">MNO</span>
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex flex-col items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('7')" type="button">
                    <span>7</span>
                    <span class="text-[9px] font-semibold text-outline tracking-wider -mt-0.5">PQRS</span>
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex flex-col items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('8')" type="button">
                    <span>8</span>
                    <span class="text-[9px] font-semibold text-outline tracking-wider -mt-0.5">TUV</span>
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex flex-col items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('9')" type="button">
                    <span>9</span>
                    <span class="text-[9px] font-semibold text-outline tracking-wider -mt-0.5">WXYZ</span>
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-[#acedff] font-bold text-base tracking-wide tabular-nums shadow-sm"
                    onclick="inputQuickZeros()" type="button">
                    000
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-white font-bold text-xl tabular-nums shadow-sm"
                    onclick="inputDigit('0')" type="button">
                    0
                </button>
                <button
                    class="keypad-press h-13 py-2.5 flex items-center justify-center bg-[#1d1d2b] border border-white/[0.04] rounded-xl text-on-surface hover:text-white shadow-sm"
                    onclick="inputBackspace()" type="button">
                    <span class="material-symbols-outlined text-[22px]">backspace</span>
                </button>
            </div>
            <!-- CTA Simpan Button (Vibrant Purple-Cyan Gradient) -->
            <button
                class="w-full h-13 py-3.5 bg-gradient-to-r from-[#9b51e0] via-[#7928ca] to-[#2575fc] text-white font-bold text-[15px] rounded-2xl flex items-center justify-center gap-2 neon-glow-btn active:scale-[0.98] transition-all"
                id="submit-btn" onclick="saveTransaction()" type="button">
                <span id="submit-text">Simpan Pengeluaran</span>
                <span class="material-symbols-outlined text-[20px]">check_circle</span>
            </button>
        </div>
    </main>
    <script>
        let rawAmount = '';
        let transactionType = 'expense';
        let selectedCategory = 'Makan & Minum';
        let selectedSource = 'BCA';
        let transferFrom = 'BCA';
        let transferTo = 'E-Wallet';

        function formatRupiah(value) {
            if (!value || value === '0') return '0';
            return value.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        function updateDisplay() {
            const displayEl = document.getElementById('amount-display');
            if (rawAmount === '' || rawAmount === '0') {
                displayEl.textContent = '0';
            } else {
                displayEl.textContent = formatRupiah(rawAmount);
            }
        }

        function inputDigit(digit) {
            if (rawAmount === '0' && digit === '0') return;
            if (rawAmount === '0') rawAmount = '';
            if (rawAmount.length < 11) {
                rawAmount += digit;
                updateDisplay();
            }
        }

        function inputQuickZeros() {
            if (rawAmount === '' || rawAmount === '0') return;
            if (rawAmount.length <= 8) {
                rawAmount += '000';
                updateDisplay();
            }
        }

        function inputBackspace() {
            if (rawAmount.length > 0) {
                rawAmount = rawAmount.slice(0, -1);
                updateDisplay();
            }
        }

        function switchType(type) {
            transactionType = type;
            const tabExpense = document.getElementById('tab-expense');
            const tabIncome = document.getElementById('tab-income');
            const tabTransfer = document.getElementById('tab-transfer');
            const typeLabel = document.getElementById('ledger-type-label');
            const submitText = document.getElementById('submit-text');
            const categorySec = document.getElementById('category-section');
            const stdSourceSec = document.getElementById('standard-source-section');
            const transferSec = document.getElementById('transfer-accounts-section');

            // Reset all tabs
            [tabExpense, tabIncome, tabTransfer].forEach(tab => {
                tab.className = "flex-1 py-2 rounded-full text-[13px] font-medium text-on-surface-variant hover:text-white transition-all flex items-center justify-center gap-1.5";
            });

            const activeClasses = "flex-1 py-2 rounded-full text-[13px] font-semibold text-white bg-gradient-to-r from-[#9b51e0] via-[#7928ca] to-[#2575fc] neon-glow-tab transition-all flex items-center justify-center gap-1.5 shadow-sm";

            if (type === 'expense') {
                tabExpense.className = activeClasses;
                typeLabel.textContent = 'NOMINAL PENGELUARAN';
                submitText.textContent = 'Simpan Pengeluaran';
                categorySec.classList.remove('hidden');
                stdSourceSec.classList.remove('hidden');
                transferSec.classList.add('hidden');
                transferSec.classList.remove('flex');
            } else if (type === 'income') {
                tabIncome.className = activeClasses;
                typeLabel.textContent = 'NOMINAL PEMASUKAN';
                submitText.textContent = 'Simpan Pemasukan';
                categorySec.classList.remove('hidden');
                stdSourceSec.classList.remove('hidden');
                transferSec.classList.add('hidden');
                transferSec.classList.remove('flex');
            } else if (type === 'transfer') {
                tabTransfer.className = activeClasses;
                typeLabel.textContent = 'NOMINAL TRANSFER';
                submitText.textContent = 'Konfirmasi Transfer';
                categorySec.classList.add('hidden');
                stdSourceSec.classList.add('hidden');
                transferSec.classList.remove('hidden');
                transferSec.classList.add('flex');
            }
        }

        function selectCategory(btn, category) {
            selectedCategory = category;
            document.getElementById('selected-category-text').textContent = category;
            const pills = document.querySelectorAll('.cat-pill');
            pills.forEach((p) => {
                p.className = 'cat-pill shrink-0 px-3.5 py-1.5 rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant hover:text-white font-medium text-[13px] flex items-center gap-1.5 transition-all';
                const icon = p.querySelector('.material-symbols-outlined');
                if (icon) icon.className = 'material-symbols-outlined text-[15px] text-on-surface-variant';
            });
            btn.className = 'cat-pill shrink-0 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-purple-600/30 to-cyan-500/30 border border-primary/50 text-white font-semibold text-[13px] shadow-sm flex items-center gap-1.5 transition-all';
            const activeIcon = btn.querySelector('.material-symbols-outlined');
            if (activeIcon) activeIcon.className = 'material-symbols-outlined text-[15px] text-[#4cd7f6]';
        }

        function selectSource(btn, source) {
            selectedSource = source;
            const chips = document.querySelectorAll('.source-chip');
            chips.forEach((c) => {
                c.className = 'source-chip px-3 py-1 rounded-xl text-[12px] font-medium bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant hover:text-white flex items-center gap-1 transition-all';
                const dot = c.querySelector('span:first-child');
                if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-slate-500';
            });
            btn.className = 'source-chip px-3 py-1 rounded-xl text-[12px] font-semibold bg-[#2a293b] border border-primary/40 text-white shadow-sm flex items-center gap-1 transition-all';
            const activeDot = btn.querySelector('span:first-child');
            if (activeDot) activeDot.className = 'w-1.5 h-1.5 rounded-full bg-[#4cd7f6]';
        }

        function selectTransferFrom(btn, source) {
            transferFrom = source;
            const chips = document.querySelectorAll('.from-chip');
            chips.forEach(c => {
                c.className = 'from-chip px-2.5 py-1 text-[12px] font-medium rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant';
            });
            btn.className = 'from-chip px-2.5 py-1 text-[12px] font-semibold rounded-xl bg-[#2a293b] border border-primary/40 text-white';
        }

        function selectTransferTo(btn, target) {
            transferTo = target;
            const chips = document.querySelectorAll('.to-chip');
            chips.forEach(c => {
                c.className = 'to-chip px-2.5 py-1 text-[12px] font-medium rounded-xl bg-[#1a1a26] border border-white/[0.06] text-on-surface-variant';
            });
            btn.className = 'to-chip px-2.5 py-1 text-[12px] font-semibold rounded-xl bg-[#2a293b] border border-primary/40 text-white';
        }

        function saveTransaction() {
            const btn = document.getElementById('submit-btn');
            btn.classList.add('opacity-80', 'scale-[0.97]');
            setTimeout(() => {
                btn.classList.remove('opacity-80', 'scale-[0.97]');
                history.back();
            }, 300);
        }
    </script>
</body>

</html>
