<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
    <meta content="mobile_tab" name="shell-type">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <style>
        @layer base {

            html,
            body {
                width: 100%;
                margin: 0;
                padding: 0;
                background-color: #13131a;
                color: #e4e1ec;
                font-family: 'Plus Jakarta Sans', sans-serif;
                -webkit-tap-highlight-color: transparent;
            }

            body {
                overscroll-behavior-y: none;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface": "#13131a", "outline": "#958ea0", "primary-container": "#a078ff", "on-tertiary": "#552100", "secondary": "#4cd7f6", "on-secondary": "#003640", "surface-container": "#1f1f26", "on-error-container": "#ffdad6", "inverse-surface": "#e4e1ec", "surface-container-lowest": "#0e0e15", "primary": "#d0bcff", "on-primary-fixed": "#23005c", "surface-container-high": "#2a2931", "tertiary-container": "#ec6a06", "on-primary-container": "#340080", "on-tertiary-container": "#4a1c00", "surface-dim": "#13131a", "secondary-fixed-dim": "#4cd7f6", "outline-variant": "#494454", "on-error": "#690005", "on-primary-fixed-variant": "#5516be", "tertiary": "#ffb690", "secondary-container": "#03b5d3", "on-secondary-fixed": "#001f26", "on-primary": "#3c0091", "surface-container-low": "#1b1b22", "surface-variant": "#34343c", "surface-tint": "#d0bcff", "on-background": "#e4e1ec", "primary-fixed-dim": "#d0bcff", "on-surface": "#e4e1ec", "inverse-primary": "#6d3bd7", "tertiary-fixed-dim": "#ffb690", "on-tertiary-fixed": "#341100", "surface-container-highest": "#34343c", "on-secondary-container": "#00424e", "inverse-on-surface": "#303038", "on-surface-variant": "#cbc3d7", "primary-fixed": "#e9ddff", "error": "#ffb4ab", "secondary-fixed": "#acedff", "on-secondary-fixed-variant": "#004e5c", "on-tertiary-fixed-variant": "#783200", "error-container": "#93000a", "tertiary-fixed": "#ffdbca", "background": "#13131a", "surface-bright": "#393841" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "margin": "1.25rem", "space-xl": "2rem", "margin-sm": "1rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "gutter": "1rem", "space-xs": "0.25rem", "space-md": "1rem", "gutter-sm": "0.75rem" }, "fontFamily": { "label-sm": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "display-currency": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"] }, "fontSize": { "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-xl-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-currency": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-sm": ["17px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } };</script>
</head>

<body
    class="bg-[#0b0b14] font-body-md text-on-surface flex flex-col min-h-screen selection:bg-purple-500/30 selection:text-white">
    <header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe">
        <div class="h-11 px-6 flex items-center justify-between text-on-surface select-none"><span
                class="text-[15px] font-semibold tracking-tight text-slate-300">9:41</span>
            <div class="flex items-center gap-1.5 text-slate-300"><span
                    class="material-symbols-outlined text-[16px]">signal_cellular_alt</span><span
                    class="material-symbols-outlined text-[16px]">wifi</span><span
                    class="material-symbols-outlined text-[20px]">battery_full</span></div>
        </div>
        <div
            class="h-14 px-5 flex items-center justify-between border-b border-white/[0.06] bg-[#0b0b14]/70 backdrop-blur-xl">
            <button aria-label="Kembali"
                class="w-10 h-10 -ml-2 rounded-xl flex items-center justify-center text-slate-300 hover:text-white active:scale-95 transition-all"
                type="button"><span class="material-symbols-outlined text-[26px]">chevron_left</span></button>
            <h1 class="text-[17px] font-semibold text-white tracking-tight">Pengaturan</h1>
            <div class="w-10"></div>
        </div>
    </header>
    <main class="flex-1 flex flex-col relative w-full pt-28 bg-[#0b0b14] overflow-x-hidden pb-safe">
        <div class="flex flex-col w-full px-margin pb-6 select-none"><!-- Subtle ambient background gradients -->
            <div
                class="absolute top-10 left-1/2 -translate-x-1/2 w-[340px] h-[220px] bg-purple-600/10 rounded-full blur-[100px] pointer-events-none -z-10">
            </div>
            <div
                class="absolute top-72 right-[-20%] w-[260px] h-[260px] bg-cyan-500/10 rounded-full blur-[90px] pointer-events-none -z-10">
            </div><!-- Main Settings Container -->
            <div class="flex flex-col gap-6 w-full"><!-- SECTION 1: MASTER DATA -->
                <div class="flex flex-col gap-2.5">
                    <div class="px-1.5 flex items-center gap-2"><span
                            class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">MASTER DATA</span>
                    </div>
                    <div
                        class="bg-slate-900/60 border border-white/10 rounded-2xl backdrop-blur-md overflow-hidden divide-y divide-white/[0.06] shadow-lg shadow-black/20">
                        <!-- Item 1: Kelola Dompet --><button
                            class="flex items-center justify-between p-4 text-left w-full group hover:bg-white/[0.02] active:bg-white/[0.04] transition-all"
                            type="button">
                            <div class="flex items-center gap-3.5 min-w-0 pr-2">
                                <div
                                    class="w-11 h-11 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center flex-shrink-0 text-white shadow-md shadow-purple-500/25 ring-1 ring-white/20">
                                    <span class="material-symbols-outlined text-[22px]"
                                        style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
                                </div>
                                <div class="flex flex-col min-w-0"><span
                                        class="text-[15px] font-medium text-white tracking-tight">Kelola
                                        Dompet</span><span class="text-[12px] text-slate-400 truncate mt-0.5">Daftar
                                        dompet, saldo awal, dan pengarsipan</span></div>
                            </div><span
                                class="material-symbols-outlined text-slate-400 group-hover:text-slate-200 text-[20px] flex-shrink-0 group-hover:translate-x-0.5 transition-transform">chevron_right</span>
                        </button><!-- Item 2: Kelola Kategori --><button
                            class="flex items-center justify-between p-4 text-left w-full group hover:bg-white/[0.02] active:bg-white/[0.04] transition-all"
                            type="button">
                            <div class="flex items-center gap-3.5 min-w-0 pr-2">
                                <div
                                    class="w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-500 to-teal-400 flex items-center justify-center flex-shrink-0 text-slate-950 shadow-md shadow-cyan-500/25 ring-1 ring-white/20">
                                    <span class="material-symbols-outlined text-[22px]"
                                        style="font-variation-settings: 'FILL' 1;">category</span>
                                </div>
                                <div class="flex flex-col min-w-0"><span
                                        class="text-[15px] font-medium text-white tracking-tight">Kelola
                                        Kategori</span><span class="text-[12px] text-slate-400 truncate mt-0.5">Kategori
                                        pemasukan dan pengeluaran</span></div>
                            </div><span
                                class="material-symbols-outlined text-slate-400 group-hover:text-slate-200 text-[20px] flex-shrink-0 group-hover:translate-x-0.5 transition-transform">chevron_right</span>
                        </button>
                    </div>
                </div><!-- SECTION 2: KEAMANAN -->
                <div class="flex flex-col gap-2.5">
                    <div class="px-1.5 flex items-center gap-2"><span
                            class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">KEAMANAN</span>
                    </div>
                    <div
                        class="bg-slate-900/60 border border-white/10 rounded-2xl backdrop-blur-md overflow-hidden shadow-lg shadow-black/20">
                        <div class="flex items-center justify-between p-4 text-left">
                            <div class="flex items-center gap-3.5 min-w-0 pr-3">
                                <div
                                    class="w-11 h-11 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center flex-shrink-0 text-white shadow-md shadow-amber-500/25 ring-1 ring-white/20">
                                    <span class="material-symbols-outlined text-[22px]"
                                        style="font-variation-settings: 'FILL' 1;">lock</span>
                                </div>
                                <div class="flex flex-col min-w-0"><span
                                        class="text-[15px] font-medium text-white tracking-tight">Kunci
                                        aplikasi</span><span class="text-[12px] text-slate-400 truncate mt-0.5">Minta
                                        autentikasi perangkat saat membuka aplikasi</span></div>
                            </div><!-- Sleek Modern Custom Toggle Switch --><label
                                class="relative inline-flex items-center cursor-pointer flex-shrink-0"><input checked=""
                                    class="sr-only peer" id="securityToggle" type="checkbox">
                                <div
                                    class="w-[52px] h-[30px] bg-slate-800 border border-white/10 peer-focus:outline-none rounded-full peer peer-checked:bg-gradient-to-r peer-checked:from-purple-600 peer-checked:to-cyan-500 peer-checked:shadow-[0_0_16px_rgba(168,85,247,0.4)] peer-checked:after:translate-x-[22px] peer-checked:after:border-white after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:bg-white after:rounded-full after:h-[24px] after:w-[24px] after:transition-all after:shadow-md transition-all">
                                </div>
                            </label>
                        </div>
                    </div>
                </div><!-- SECTION 3: CADANGAN & PEMULIHAN -->
                <div class="flex flex-col gap-2.5">
                    <div class="px-1.5 flex items-center gap-2"><span
                            class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">CADANGAN &amp;
                            PEMULIHAN</span></div>
                    <div
                        class="bg-slate-900/60 border border-white/10 rounded-2xl backdrop-blur-md overflow-hidden divide-y divide-white/[0.06] shadow-lg shadow-black/20">
                        <!-- Item 1: Cadangkan data --><button
                            class="flex items-center justify-between p-4 text-left w-full group hover:bg-white/[0.02] active:bg-white/[0.04] transition-all"
                            type="button">
                            <div class="flex items-center gap-3.5 min-w-0 pr-2">
                                <div
                                    class="w-11 h-11 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center flex-shrink-0 text-slate-950 shadow-md shadow-teal-500/25 ring-1 ring-white/20">
                                    <span class="material-symbols-outlined text-[22px]"
                                        style="font-variation-settings: 'FILL' 1;">cloud_upload</span>
                                </div>
                                <div class="flex flex-col min-w-0"><span
                                        class="text-[15px] font-medium text-white tracking-tight">Cadangkan
                                        data</span><span class="text-[12px] text-slate-400 truncate mt-0.5">Simpan file
                                        JSON ke penyimpanan atau bagikan</span></div>
                            </div><span
                                class="material-symbols-outlined text-slate-400 group-hover:text-slate-200 text-[20px] flex-shrink-0 group-hover:translate-x-0.5 transition-transform">chevron_right</span>
                        </button><!-- Item 2: Pulihkan data --><button
                            class="flex items-center justify-between p-4 text-left w-full group hover:bg-white/[0.02] active:bg-white/[0.04] transition-all"
                            type="button">
                            <div class="flex items-center gap-3.5 min-w-0 pr-2">
                                <div
                                    class="w-11 h-11 rounded-xl bg-gradient-to-tr from-violet-600 to-purple-400 flex items-center justify-center flex-shrink-0 text-white shadow-md shadow-violet-500/25 ring-1 ring-white/20">
                                    <span class="material-symbols-outlined text-[22px]"
                                        style="font-variation-settings: 'FILL' 1;">settings_backup_restore</span>
                                </div>
                                <div class="flex flex-col min-w-0"><span
                                        class="text-[15px] font-medium text-white tracking-tight">Pulihkan
                                        data</span><span class="text-[12px] text-slate-400 truncate mt-0.5">Ganti
                                        seluruh data dari berkas cadangan JSON</span></div>
                            </div><span
                                class="material-symbols-outlined text-slate-400 group-hover:text-slate-200 text-[20px] flex-shrink-0 group-hover:translate-x-0.5 transition-transform">chevron_right</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <script>
            // Interactive toggle micro-state
            const toggle = document.getElementById('securityToggle');
            if (toggle) {
                toggle.addEventListener('change', function () {
                    // Haptic imitation through smooth visual transition handled by peer classes
                });
            }
        </script>
    </main>

</body>

</html>
