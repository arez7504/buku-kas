<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
    <meta content="mobile_stack" name="shell-type">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <style>
        @layer base {

            html,
            body {
                width: 100%;
                margin: 0;
                padding: 0;
                background-color: #13131a;
                color: #e4e1ec;
                font-family: 'Plus Jakarta Sans', sans-serif;
                -webkit-tap-highlight-color: transparent;
            }

            body {
                overscroll-behavior-y: none;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface": "#13131a", "outline": "#958ea0", "primary-container": "#a078ff", "on-tertiary": "#552100", "secondary": "#4cd7f6", "on-secondary": "#003640", "surface-container": "#1f1f26", "on-error-container": "#ffdad6", "inverse-surface": "#e4e1ec", "surface-container-lowest": "#0e0e15", "primary": "#d0bcff", "on-primary-fixed": "#23005c", "surface-container-high": "#2a2931", "tertiary-container": "#ec6a06", "on-primary-container": "#340080", "on-tertiary-container": "#4a1c00", "surface-dim": "#13131a", "secondary-fixed-dim": "#4cd7f6", "outline-variant": "#494454", "on-error": "#690005", "on-primary-fixed-variant": "#5516be", "tertiary": "#ffb690", "secondary-container": "#03b5d3", "on-secondary-fixed": "#001f26", "on-primary": "#3c0091", "surface-container-low": "#1b1b22", "surface-variant": "#34343c", "surface-tint": "#d0bcff", "on-background": "#e4e1ec", "primary-fixed-dim": "#d0bcff", "on-surface": "#e4e1ec", "inverse-primary": "#6d3bd7", "tertiary-fixed-dim": "#ffb690", "on-tertiary-fixed": "#341100", "surface-container-highest": "#34343c", "on-secondary-container": "#00424e", "inverse-on-surface": "#303038", "on-surface-variant": "#cbc3d7", "primary-fixed": "#e9ddff", "error": "#ffb4ab", "secondary-fixed": "#acedff", "on-secondary-fixed-variant": "#004e5c", "on-tertiary-fixed-variant": "#783200", "error-container": "#93000a", "tertiary-fixed": "#ffdbca", "background": "#13131a", "surface-bright": "#393841" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "margin": "1.25rem", "space-xl": "2rem", "margin-sm": "1rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "gutter": "1rem", "space-xs": "0.25rem", "space-md": "1rem", "gutter-sm": "0.75rem" }, "fontFamily": { "label-sm": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "display-currency": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"] }, "fontSize": { "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-xl-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-currency": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-sm": ["17px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } };</script>
</head>

<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen">
    <header
        class="fixed top-0 inset-x-0 z-50 bg-[#0d0d18]/85 backdrop-blur-2xl border-b border-white/[0.07] pt-safe shadow-2xl">
        <div class="h-11 px-6 flex items-center justify-between text-on-surface select-none"><span
                class="text-[15px] font-semibold tracking-tight">9:41</span>
            <div class="flex items-center gap-1.5"><span
                    class="material-symbols-outlined text-[16px]">signal_cellular_alt</span><span
                    class="material-symbols-outlined text-[16px]">wifi</span><span
                    class="material-symbols-outlined text-[20px]">battery_full</span></div>
        </div>
        <div class="h-14 px-4 flex items-center justify-between"><button aria-label="Kembali"
                class="w-10 h-10 -ml-1 rounded-full flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/5 active:scale-95 transition-all"
                onclick="history.back()"><span
                    class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button>
            <h1 class="text-[17px] font-bold text-white tracking-tight">Kelola Dompet</h1><button
                aria-label="Tambah Dompet"
                class="w-10 h-10 -mr-1 rounded-full flex items-center justify-center text-primary bg-primary/10 border border-primary/20 hover:bg-primary/20 active:scale-95 transition-all shadow-[0_0_12px_rgba(160,120,255,0.2)]"><span
                    class="material-symbols-outlined text-[22px]">add</span></button>
        </div>
    </header>
    <main class="flex-1 flex flex-col relative w-full pt-28 pb-14 min-h-screen bg-[#0b0b14] overflow-hidden">
        <div
            class="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary/10 rounded-full blur-3xl">
        </div>
        <div class="pointer-events-none absolute top-1/3 -right-24 w-80 h-80 bg-secondary/10 rounded-full blur-3xl">
        </div>
        <div class="flex flex-col w-full px-4 space-y-3.5 relative z-10">
            <div
                class="w-full bg-[#141422]/90 border border-white/[0.08] hover:border-cyan-400/30 backdrop-blur-xl rounded-2xl p-4 shadow-[0_8px_24px_rgba(0,0,0,0.45)] transition-all flex items-center justify-between group">
                <div class="flex items-center gap-3.5 min-w-0 flex-1">
                    <div
                        class="w-12 h-12 rounded-2xl bg-gradient-to-br from-teal-500/25 to-cyan-500/10 border border-cyan-400/30 flex items-center justify-center shrink-0 shadow-[0_0_16px_rgba(76,215,246,0.2)] group-hover:shadow-[0_0_20px_rgba(76,215,246,0.35)] transition-shadow">
                        <span class="material-symbols-outlined text-cyan-300 text-[24px]">account_balance</span>
                    </div>
                    <div class="flex flex-col min-w-0"><span
                            class="text-[16px] font-bold text-white tracking-tight truncate">Seabank</span>
                        <div class="flex items-baseline gap-1 mt-0.5"><span
                                class="text-[13px] text-slate-400 font-normal">Saldo sekarang:</span><span
                                class="text-[14px] font-bold text-cyan-200 tracking-tight">Rp 11.678.000</span></div>
                        <span class="text-[12px] text-slate-500 mt-0.5 tracking-tight">Saldo awal: Rp 10.788.000</span>
                    </div>
                </div><button aria-label="Menu Seabank"
                    class="w-9 h-9 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 active:scale-90 transition-all shrink-0 ml-2"><span
                        class="material-symbols-outlined text-[20px]">more_vert</span></button>
            </div>
            <div
                class="w-full bg-[#141422]/90 border border-white/[0.08] hover:border-amber-400/30 backdrop-blur-xl rounded-2xl p-4 shadow-[0_8px_24px_rgba(0,0,0,0.45)] transition-all flex items-center justify-between group">
                <div class="flex items-center gap-3.5 min-w-0 flex-1">
                    <div
                        class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-500/25 to-orange-500/10 border border-amber-400/30 flex items-center justify-center shrink-0 shadow-[0_0_16px_rgba(255,182,144,0.2)] group-hover:shadow-[0_0_20px_rgba(255,182,144,0.35)] transition-shadow">
                        <span class="material-symbols-outlined text-amber-300 text-[24px]">payments</span>
                    </div>
                    <div class="flex flex-col min-w-0"><span
                            class="text-[16px] font-bold text-white tracking-tight truncate">Tunai</span>
                        <div class="flex items-baseline gap-1 mt-0.5"><span
                                class="text-[13px] text-slate-400 font-normal">Saldo sekarang:</span><span
                                class="text-[14px] font-bold text-white tracking-tight">Rp 189.500</span></div><span
                            class="text-[12px] text-slate-500 mt-0.5 tracking-tight">Saldo awal: Rp 506.000</span>
                    </div>
                </div><button aria-label="Menu Tunai"
                    class="w-9 h-9 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 active:scale-90 transition-all shrink-0 ml-2"><span
                        class="material-symbols-outlined text-[20px]">more_vert</span></button>
            </div>
            <div
                class="w-full bg-[#141422]/90 border border-white/[0.08] hover:border-violet-400/30 backdrop-blur-xl rounded-2xl p-4 shadow-[0_8px_24px_rgba(0,0,0,0.45)] transition-all flex items-center justify-between group">
                <div class="flex items-center gap-3.5 min-w-0 flex-1">
                    <div
                        class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-500/25 to-violet-500/10 border border-violet-400/30 flex items-center justify-center shrink-0 shadow-[0_0_16px_rgba(208,188,255,0.2)] group-hover:shadow-[0_0_20px_rgba(208,188,255,0.35)] transition-shadow">
                        <span
                            class="material-symbols-outlined text-purple-300 text-[24px]">account_balance_wallet</span>
                    </div>
                    <div class="flex flex-col min-w-0"><span
                            class="text-[16px] font-bold text-white tracking-tight truncate">E-Wallet</span>
                        <div class="flex items-baseline gap-1 mt-0.5"><span
                                class="text-[13px] text-slate-400 font-normal">Saldo sekarang:</span><span
                                class="text-[14px] font-bold text-white tracking-tight">Rp 0</span></div><span
                            class="text-[12px] text-slate-500 mt-0.5 tracking-tight">Saldo awal: Rp 0</span>
                    </div>
                </div><button aria-label="Menu E-Wallet"
                    class="w-9 h-9 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 active:scale-90 transition-all shrink-0 ml-2"><span
                        class="material-symbols-outlined text-[20px]">more_vert</span></button>
            </div>
        </div>
    </main>
    <footer class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe">
        <div class="flex justify-center items-center w-full pb-2">
            <div class="w-36 h-1 bg-on-surface/30 rounded-full"></div>
        </div>
    </footer>
</body>

</html>
